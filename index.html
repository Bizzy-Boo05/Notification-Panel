<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notification Panel | Priyanshi</title>
  <link rel="icon" href="./pslogo.png" type="image/png">
  

  <!-- Bootstrap CSS (mobile-first framework) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap icons (optional) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    /* Mobile-first styles (then larger breakpoints) */
    :root{
      --bg: #fffdfa;
      --card: #f6f3ef;
      --accent: #414a37;
      --muted: #6b6258;
      --accent-2: #99744a;
    }
    body { background: var(--bg); color: var(--accent); font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; }
    .app-header { background: linear-gradient(90deg, var(--accent) 0%, var(--accent-2) 100%); color: #fff; padding: 14px 12px; }
    .app-title { font-weight:700; font-size:1.05rem; letter-spacing:0.2px; }
    .container-app { padding: 14px; max-width: 900px; margin-inline:auto; }
    .notif-card { background: var(--card); border-radius:12px; box-shadow: 0 4px 14px rgba(0,0,0,0.06); padding:12px; margin-bottom:12px; }
    .notif-head { display:flex; gap:10px; align-items:center; justify-content:space-between; }
    .notif-meta { font-size:0.82rem; color:var(--muted); }
    .badge-unread { background:#d9534f; color:#fff; font-weight:600; border-radius:8px; padding:4px 7px; font-size:0.72rem; }
    .btn-ghost { background: transparent; border: 1px solid rgba(0,0,0,0.06); }
    .small-muted { font-size:0.85rem; color:var(--muted); }
    /* Desktop */
    @media(min-width:768px){
      .app-row { display:flex; gap:18px; align-items:flex-start; }
      .left-col { flex:1; }
      .right-col { width:320px; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="app-header">
    <div class="container-app d-flex align-items-center justify-content-between">
      <div class="d-flex align-items-center gap-3">
        <div class="me-2"><i class="bi bi-bell-fill" style="font-size:1.2rem; opacity:0.95"></i></div>
        <div>
          <div class="app-title">Notifications</div>
          <div class="small-muted">Mobile-first — stays unchanged unless edited</div>
        </div>
      </div>

      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-light btn-sm" id="btnReset" title="Reset to defaults">Reset</button>
        <button class="btn btn-light btn-sm" id="btnClear" title="Clear all">Clear</button>
      </div>
    </div>
  </header>

  <!-- Main -->
  <main class="container-app mt-3">
    <div class="app-row">

      <!-- Left column: notifications list -->
      <section class="left-col">

        <!-- Controls -->
        <div class="d-flex gap-2 mb-3">
          <input id="search" type="search" class="form-control form-control-sm" placeholder="Search notifications (title or text)">
          <select id="filter" class="form-select form-select-sm" style="max-width:160px;">
            <option value="all">All</option>
            <option value="unread">Unread</option>
            <option value="read">Read</option>
          </select>
        </div>

        <!-- Notifications list (rendered by JS) -->
        <div id="list"></div>

        <!-- Empty state -->
        <div id="emptyState" class="text-center small-muted mt-4" style="display:none;">
          No notifications to show.
        </div>
      </section>

      <!-- Right column: add / preview -->
      <aside class="right-col mt-3 mt-md-0">
        <div class="notif-card mb-3">
          <div class="fw-bold mb-1">Add Notification</div>

          <div class="mb-2">
            <label class="form-label small-muted">Title</label>
            <input id="title" class="form-control form-control-sm" placeholder="Short title (required)">
          </div>

          <div class="mb-2">
            <label class="form-label small-muted">Message</label>
            <textarea id="message" class="form-control form-control-sm" rows="3" placeholder="Notification text (required)"></textarea>
          </div>

          <div class="mb-2">
            <label class="form-label small-muted">Type</label>
            <select id="type" class="form-select form-select-sm">
              <option value="info">Info</option>
              <option value="success">Success</option>
              <option value="warning">Warning</option>
              <option value="danger">Alert</option>
            </select>
          </div>

          <div class="d-flex gap-2">
            <button id="btnAdd" class="btn btn-sm" style="background:var(--accent); color:#fff;">Add</button>
            <button id="btnPreview" class="btn btn-sm btn-ghost">Preview</button>
          </div>

        </div>

        <!-- Preview of what new notification will look like -->
        <div id="previewBox" class="notif-card" style="display:none;">
          <div class="notif-head">
            <div class="fw-semibold" id="previewTitle">Preview title</div>
            <div class="notif-meta"><span id="previewType" class="badge rounded-pill bg-secondary">Info</span></div>
          </div>
          <div class="mt-2 small-muted" id="previewMessage">Preview message text</div>
          <div class="mt-3 small-muted">Saved only when you press <strong>Add</strong>.</div>
        </div>

      </aside>
    </div>
  </main>

  <!-- Edit Modal (Bootstrap modal: works without extra JS libs) -->
  <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Edit Notification</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <label class="form-label small-muted">Title</label>
          <input id="editTitle" class="form-control form-control-sm mb-2">
          <label class="form-label small-muted">Message</label>
          <textarea id="editMessage" class="form-control form-control-sm mb-2" rows="3"></textarea>
          <label class="form-label small-muted">Type</label>
          <select id="editType" class="form-select form-select-sm mb-2">
            <option value="info">Info</option>
            <option value="success">Success</option>
            <option value="warning">Warning</option>
            <option value="danger">Alert</option>
          </select>
        </div>
        <div class="modal-footer">
          <button id="saveEdit" class="btn btn-primary btn-sm">Save</button>
          <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS bundle (includes Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="notify.js"></script>

  
</body>
</html>
